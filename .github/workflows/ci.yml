name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-auth-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meloman_ci
      NEXT_PUBLIC_PUSHER_KEY: ci-pusher-key
      NEXT_PUBLIC_PUSHER_CLUSTER: eu
      PUSHER_APP_ID: ci-pusher-app-id
      PUSHER_KEY: ci-pusher-key
      PUSHER_SECRET: ci-pusher-secret
      PUSHER_CLUSTER: eu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @meloman/web lint

      - name: Typecheck
        run: pnpm --filter @meloman/web exec tsc --noEmit

      - name: Test
        run: pnpm --filter @meloman/web test:ci

      - name: Mobile typecheck
        run: pnpm --filter mobile typecheck

      - name: Mobile unit tests
        run: pnpm --filter mobile test

      - name: Install Playwright browsers
        run: pnpm --filter @meloman/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @meloman/web test:e2e

      - name: Build
        run: pnpm --filter @meloman/web build
